# Backup semanal do banco (o plano grátis do Supabase não tem backup para baixar).
# Faz o dump de papéis, esquema e dados, CRIPTOGRAFA (AES-256) e guarda como
# artifact por 90 dias. O repositório é público: sem criptografia, qualquer um
# com conta no GitHub poderia baixar os dados dos usuários.
#
# Configuração (uma vez) — Settings → Secrets and variables → Actions → New secret:
#   SUPABASE_DB_URL     connection string do "Session pooler" (botão Connect do
#                       Supabase), já com a senha do banco. O "Direct connection"
#                       não funciona aqui: é só IPv6 e o GitHub não tem IPv6.
#   BACKUP_PASSPHRASE   uma senha longa só para os backups (guarde num lugar seguro;
#                       sem ela o backup não abre).
# Como restaurar: SECURITY.md → "Backups".
name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * 1' # toda segunda, 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backup desligado: cadastre os secrets SUPABASE_DB_URL e BACKUP_PASSPHRASE (ver .github/workflows/backup.yml)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          version: latest

      - name: Dump do banco
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only --schema public,auth

      - name: Compactar e criptografar
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          NAME="statsup-backup-$(date -u +%Y-%m-%d)"
          tar -czf - -C backup . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -pass env:BACKUP_PASSPHRASE -out "$NAME.tar.gz.enc"
          rm -rf backup   # não deixa nada em texto aberto no runner
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.enc
          retention-days: 90
